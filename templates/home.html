<!DOCTYPE html>
<html>
    <head>
        <title>
          {% if title %}
            Nitro Blog - {{ title }}
          {% else %}
            Nitro Blog
          {% endif %}
        </title>
    </head>
    <body>
        <h1>Hello, FastAPI Nitro Blog!</h1>
        {% for post in posts %}
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
        {% endfor %}
    </body>
</html>
